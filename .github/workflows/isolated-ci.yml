name: Isolated CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: isolated-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-boundary:
    name: Windows clean install, build and isolation boundary
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      PRISMA_SKIP_POSTINSTALL_GENERATE: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      CHECKPOINT_DISABLE: '1'
    steps:
      - name: Check out reviewed source without retained credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Use the supported pinned Node runtime
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '22.23.2'
      - name: Install locked dependencies without lifecycle hooks
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Explicitly prepare locked Prisma engines
        run: npm run prepare:engines
      - name: Initialize a fresh isolated database and guarded client
        run: npm run setup
      - name: Compile current source
        run: npm run build
      - name: Run the single isolation boundary suite
        run: npm test
